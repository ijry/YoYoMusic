name: CI

on:
  push:
    branches: [main]
    # Docs-only changes are covered by the Docs workflow; don't spend build
    # minutes on them here.
    paths-ignore:
      - "docs-site/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # `tauri build` refuses to run when the Rust `tauri` crate and the npm
      # `@tauri-apps/api` package are on different minor versions, and nothing
      # else notices: `cargo test` does not care and neither does this build.
      # Without this check the mismatch only shows up in the release job, after
      # a tag has been pushed. It has already cost one release.
      - name: Tauri version check
        run: node scripts/check-tauri-versions.mjs

      # The release scripts decide what every existing install polls and
      # downloads, so a regression here silently strands users on an old
      # version. They are plain node modules precisely so they can be tested.
      - name: Release script tests
        run: node --test scripts/*.test.mjs

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Tauri crate links against WebKitGTK, and rodio links against ALSA,
      # so both have to be present before `cargo test` can even compile.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
