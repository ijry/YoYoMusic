name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag-vs-branch check below needs real history, not a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Runs before anything is built: a tag that disagrees with the version
      # files would otherwise ship installers whose filename, About box and
      # updater metadata all report a different release.
      - name: Validate the tag against every version file
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(node -p "require('node:fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"(.+?)\"/m)[1]")"

          failed=0
          for entry in "package.json:${package_version}" "src-tauri/tauri.conf.json:${tauri_version}" "src-tauri/Cargo.toml:${cargo_version}"; do
            file="${entry%%:*}"
            version="${entry#*:}"
            if [[ "$version" != "$tag_version" ]]; then
              echo "::error file=${file}::declares ${version}, but the tag is ${GITHUB_REF_NAME}."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "package.json, tauri.conf.json and Cargo.toml all agree on ${tag_version}."

      - name: Ensure the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Unit tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: "nsis,msi"
            artifact: yoyomusic-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - label: macOS
            os: macos-latest
            bundles: "dmg"
            artifact: yoyomusic-macos
            paths: src-tauri/target/release/bundle/dmg/*.dmg
          - label: Linux
            os: ubuntu-latest
            bundles: "deb,appimage"
            artifact: yoyomusic-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs `beforeBuildCommand` (npm run build) itself, so the
      # frontend is not built separately here.
      - name: Build installers
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalise installer filenames
        shell: bash
        run: |
          set -euo pipefail
          # Tauri names bundles after `productName`, which is Chinese here, and
          # the release uploader strips non-ASCII characters — the assets would
          # be published as `_0.0.1_x64-setup.exe`. Rename them to the ASCII
          # product name before uploading.
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            ascii="$(printf '%s' "$base" | sed 's/^[^A-Za-z0-9]*//; s/^_*//')"
            mv "$file" "$dir/YoYoMusic_${ascii}"
          done < <(find release-assets -type f ! -name 'YoYoMusic_*' -print0)
          find release-assets -type f | sort

      - name: Collect release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The annotated tag message is the changelog. `git log -1 $GITHUB_SHA`
          # would return the *commit* message instead — the last fix commit —
          # and actions/checkout does not reliably leave the tag ref behind, so
          # read the tag object through the API rather than a local ref.
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          if [[ "$(gh api "$ref" -q .object.type)" == "tag" ]]; then
            tag_sha="$(gh api "$ref" -q .object.sha)"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" -q .message > release-body.md
          else
            git log -1 --format=%B "$GITHUB_SHA" > release-body.md
          fi
          if [[ ! -s release-body.md ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} carries no message; the release would have no notes."
            exit 1
          fi
          cat .github/release-footer.md >> release-body.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
