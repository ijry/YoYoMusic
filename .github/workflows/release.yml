name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag-vs-branch check below needs real history, not a shallow clone.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Runs before anything is built: a tag that disagrees with the version
      # files would otherwise ship installers whose filename, About box and
      # updater metadata all report a different release.
      - name: Validate the tag against every version file
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(node -p "require('node:fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"(.+?)\"/m)[1]")"

          failed=0
          for entry in "package.json:${package_version}" "src-tauri/tauri.conf.json:${tauri_version}" "src-tauri/Cargo.toml:${cargo_version}"; do
            file="${entry%%:*}"
            version="${entry#*:}"
            if [[ "$version" != "$tag_version" ]]; then
              echo "::error file=${file}::declares ${version}, but the tag is ${GITHUB_REF_NAME}."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "package.json, tauri.conf.json and Cargo.toml all agree on ${tag_version}."

      - name: Ensure the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}."
            exit 1
          fi

      # Checked here rather than at the manifest step: a missing key would
      # otherwise surface only after three platforms have been built and signed
      # nothing, which is the expensive way to find out.
      - name: Ensure the updater signing key is available
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The updater refuses unsigned bundles, so the release would be unusable."
            exit 1
          fi
          if [[ -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set. The key in D:/Repos/xyito/config/yoyomusic carries a password."
            exit 1
          fi

      - name: Release script tests
        run: node --test scripts/*.test.mjs

      # Belt and braces: CI runs this too, but the release is where a mismatch
      # actually breaks the build, and this job is cheap.
      - name: Tauri version check
        run: node scripts/check-tauri-versions.mjs

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Unit tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: "nsis,msi"
            artifact: yoyomusic-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - label: macOS
            os: macos-latest
            bundles: "dmg"
            artifact: yoyomusic-macos
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              # The dmg is for installing by hand; the signed tarball is what the
              # updater downloads, because a running .app cannot be swapped for
              # a mounted disk image.
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - label: Linux
            os: ubuntu-latest
            bundles: "deb,appimage"
            artifact: yoyomusic-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs `beforeBuildCommand` (npm run build) itself, so the
      # frontend is not built separately here.
      #
      # The signing key makes `createUpdaterArtifacts` produce a `.sig` beside
      # every bundle. Without it the build still succeeds but the updater
      # artifacts are unsigned, and the manifest step fails rather than
      # publishing a release whose updates can never install.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # The renaming logic lives in a script rather than inline shell so it can
      # be tested: the first attempt stripped the dot out of
      # `悠悠乐听.app.tar.gz`, which turned the macOS updater payload into
      # `YoYoMusic_app.tar.gz`. `npm test` and the verify job both cover it now.
      - name: Normalise installer filenames
        run: |
          set -euo pipefail
          node scripts/normalise-asset-names.mjs release-assets
          echo "--- assets to publish ---"
          find release-assets -type f | sort

      - name: Collect release notes from the tag
        run: |
          set -euo pipefail
          # The annotated tag message is the changelog. `git log -1 $GITHUB_SHA`
          # would return the *commit* message instead — the last fix commit —
          # so read the tag object itself. The tag ref is not guaranteed to be
          # in the checkout, hence the explicit fetch.
          git fetch --force --tags origin
          git cat-file -p "refs/tags/${GITHUB_REF_NAME}" | sed '1,/^$/d' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} carries no message; the release would have no notes."
            exit 1
          fi
          # The footer already covers 下载 / 安装提示 / 链接. A tag message that
          # repeats any of those headings renders two identical sections on the
          # release page, so fail loudly instead of shipping the duplication.
          # Compare *before* appending, otherwise the footer always matches.
          dupes="$(comm -12 \
            <(grep '^#' release-notes.md | sort -u) \
            <(grep '^#' .github/release-footer.md | sort -u))"
          if [[ -n "$dupes" ]]; then
            echo "::error::Tag message duplicates release-footer.md headings: $dupes"
            exit 1
          fi
          # The in-app update dialog shows the notes without the footer: the
          # download table and the install tips are release-page furniture.
          cp release-notes.md release-body.md
          cat .github/release-footer.md >> release-body.md
          echo "release-body.md: $(wc -l < release-body.md) lines, $(grep -c '^#' release-body.md) headings"
          head -4 release-body.md

      - name: Generate the updater manifest
        run: |
          set -euo pipefail
          node scripts/create-updater-manifest.mjs \
            --assets-dir release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md \
            --output release-assets/latest.json
          echo "--- latest.json ---"
          cat release-assets/latest.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
